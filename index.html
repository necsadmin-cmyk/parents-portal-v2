<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07365B">
  <meta name="description" content="NECS — Form 1 Parent Portal">
  <title>NECS Parent Portal | North East Comprehensive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-page="home" aria-label="Go to home">
      <img class="brand-mark brand-crest" src="assets/NEC_school_crest_transparent.png" alt="North East Comprehensive crest">
      <span class="brand-copy"><strong>North East Comprehensive</strong><small>Form 1 Parent Portal</small></span>
    </button>
    <button id="menuBtn" class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>

    <button data-page="gallery">Gallery</button>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="footer">
    <span><strong>North East Comprehensive</strong><br><em>Education is freedom. Embrace it!</em></span>
    <button data-page="home">Home</button>

  <script src="app.js"></script>

</html>
